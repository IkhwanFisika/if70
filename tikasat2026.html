<body class="bg-gradient-to-br from-slate-900 to-slate-800 min-h-screen flex items-center justify-center p-4">

  <div class="max-w-md w-full">
    <!-- Login Card -->
    <div id="login-card" class="card bg-white rounded-3xl shadow-2xl p-8">
      <div class="text-center mb-8">
        <div class="inline-flex items-center justify-center w-16 h-16 bg-emerald-100 rounded-2xl mb-4">
          <i class="fas fa-graduation-cap text-3xl text-emerald-600"></i>
        </div>
        <h1 class="text-2xl font-semibold text-slate-800">Nilai ASAT TIK 2026</h1>
        <p class="text-slate-500 mt-1">Username: NIK <br>Password: 3 huruf terakir nama lengkap anda KAPITAL</p>
      </div>

      <div class="space-y-5">
        <div>
          <label class="block text-sm font-medium text-slate-600 mb-1">Username</label>
          <input id="username" type="text" class="w-full px-4 py-3 border border-slate-200 rounded-2xl focus:outline-none focus:border-emerald-500" placeholder="Contoh: 27967"/>
        </div>
        <div>
          <label class="block text-sm font-medium text-slate-600 mb-1">Password</label>
          <input id="password" type="password" class="w-full px-4 py-3 border border-slate-200 rounded-2xl focus:outline-none focus:border-emerald-500" placeholder="Contoh: WAN"/>
        </div>

        <button onclick="cekNilai()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-3.5 rounded-2xl transition-all active:scale-95">
          Cek Nilai
        </button>

        <div id="error-msg" class="hidden text-red-500 text-sm text-center mt-2 font-medium"></div>
      </div>
    </div>

    <!-- Result Card -->
    <div id="result-card" class="card hidden bg-white rounded-3xl shadow-2xl p-8">
      <div class="text-center">
        <div class="w-20 h-20 mx-auto bg-emerald-100 rounded-2xl flex items-center justify-center mb-6">
          <i class="fas fa-trophy text-4xl text-emerald-600"></i>
        </div>
        <h2 class="text-xl font-medium text-slate-700">Hasil Nilai</h2>
      </div>

      <div class="mt-8 space-y-6">
        <div class="bg-slate-50 rounded-2xl p-6">
          <p class="text-slate-500 text-sm">Nama Lengkap</p>
          <p id="nama-siswa" class="text-2xl font-semibold text-slate-800 mt-1"></p>
        </div>
        <div class="grid grid-cols-2 gap-4">
          <div class="bg-slate-50 rounded-2xl p-6">
            <p class="text-slate-500 text-sm">Kelas</p>
            <p id="kelas-siswa" class="text-xl font-semibold text-slate-700 mt-1"></p>
          </div>
          <div class="bg-slate-50 rounded-2xl p-6">
            <p class="text-slate-500 text-sm">Nilai ASAT TIK</p>
            <p id="nilai-siswa" class="text-4xl font-bold text-emerald-600 mt-1"></p>
          </div>
        </div>
      </div>

      <button onclick="kembaliLogin()" class="mt-8 w-full border border-slate-300 hover:border-slate-400 text-slate-700 font-medium py-3 rounded-2xl transition-all">
        Kembali
      </button>
    </div>
  </div>

    function rot13(str) {
      return str.replace(/[a-zA-Z0-9]/g, function(c) {
        if (c.match(/[a-z]/i)) {
          const start = c <= 'Z' ? 65 : 97;
          return String.fromCharCode(((c.charCodeAt(0) - start + 13) % 26) + start);
        }
        return c;
      });
    }

    function decodeData() {
      let decoded = obfuscatedData.split('').reverse().join('');
      decoded = rot13(decoded);
      const lines = decoded.trim().split('\n');
      return lines.slice(1).map(line => {
        const parts = line.split(',');
        return {
          user: parts[0],
          password: parts[1],
          nama: parts[2],
          kelas: parts[3],
          nilai: parts[4]
        };
      });
    }

    let students = [];

    function cekNilai() {
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value.trim();
      const errorMsg = document.getElementById('error-msg');

      errorMsg.classList.add('hidden');

      if (!username || !password) {
        errorMsg.textContent = "Username dan password harus diisi!";
        errorMsg.classList.remove('hidden');
        return;
      }

      if (students.length === 0) {
        students = decodeData();
      }

      const found = students.find(s => s.user === username && s.password === password);

      if (found) {
        document.getElementById('login-card').classList.add('hidden');
        const result = document.getElementById('result-card');
        result.classList.remove('hidden');

        document.getElementById('nama-siswa').textContent = found.nama;
        document.getElementById('kelas-siswa').textContent = found.kelas;
        document.getElementById('nilai-siswa').textContent = parseFloat(found.nilai).toFixed(2);
      } else {
        errorMsg.textContent = "Username atau password salah!";
        errorMsg.classList.remove('hidden');
      }
    }

    function kembaliLogin() {
      document.getElementById('result-card').classList.add('hidden');
      document.getElementById('login-card').classList.remove('hidden');
      document.getElementById('username').value = '';
      document.getElementById('password').value = '';
      document.getElementById('error-msg').classList.add('hidden');
    }
